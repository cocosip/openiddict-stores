name: CI/CD Pipeline

# Branch pushes and pull requests only build and test (the same gate scripts/verify.ps1 runs locally:
# restore, Release build for all five target frameworks, unit + integration tests, package checks).
# Publishing happens only on a version tag: v*.*.* packs the eight packages and pushes them to NuGet,
# then creates a GitHub release carrying the artifacts.
#
# Required secret: NUGET_API_KEY (nuget.org API key).

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # One definition of "green" for local work and CI: the script runs restore, build, pack (packages
      # before tests - the package asset tests read them), and tests, and fails on any non-zero step.
      # The server-backed suites skip honestly because no database is installed on the runner.
      - name: Run the verification gates
        shell: pwsh
        run: ./scripts/verify.ps1

  publish:
    name: Pack and Publish (tag)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from the tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Restore dependencies
        run: dotnet restore Sharp.OpenIddict.Stores.slnx --verbosity minimal

      - name: Build solution
        run: dotnet build Sharp.OpenIddict.Stores.slnx --configuration ${{ env.CONFIGURATION }} --no-restore --verbosity minimal

      - name: Pack NuGet packages
        run: |
          mkdir -p ./packages
          dotnet pack Sharp.OpenIddict.Stores.slnx \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output ./packages \
            /p:ContinuousIntegrationBuild=true \
            /p:Version=${{ steps.version.outputs.version }} \
            --verbosity minimal

      - name: Verify the eight packages
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem ./packages/*.nupkg)
          if ($packages.Count -ne 8) {
            throw "Expected 8 packages, found $($packages.Count)."
          }
          $packages | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push ./packages/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --reverse)
          fi

          {
            echo 'CHANGELOG<<EOF'
            echo "$CHANGELOG"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          body: |
            ## Release v${{ steps.version.outputs.version }}

            ### Packages
            The eight Sharp.OpenIddict.Stores packages (core, models, and six database providers),
            also published to the [NuGet Gallery](https://www.nuget.org/packages/Sharp.OpenIddict.Stores).

            ### Changes
            ${{ steps.changelog.outputs.CHANGELOG }}
          files: ./packages/*.nupkg
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}
